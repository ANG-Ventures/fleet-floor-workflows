# Reusable floor component: `ci` — pytest if a tests dir exists, else import-smoke.
# Part of the fleet-floor (greploop posture-B). Called via `uses:` + an immutable SHA.
# Emits a check-run whose internal job name is the literal floor component `ci`
# (frozen contract — renaming this job is a breaking fleet-wide change; see spec D-12).
name: floor-ci

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label (self-hosted opt-in; default GitHub-hosted)."
        type: string
        default: "ubuntu-latest"
      python-version:
        description: "Python version for the runner."
        type: string
        default: "3.11"
      timeout-minutes:
        description: "Job timeout in minutes, including installation; override for larger suites."
        type: number
        default: 20
      working-directory:
        description: "Dir containing the package (pyproject.toml / setup.py)."
        type: string
        default: "."
      tests-path:
        description: "Tests directory (relative to working-directory)."
        type: string
        default: "tests"
      pytest-workers:
        description: "Opt-in pytest-xdist worker count ('auto' or a positive integer); empty = serial pytest."
        type: string
        default: ""
      import-name:
        description: "Module to import-smoke when there are no tests (e.g. 'mypkg')."
        type: string
        default: ""
      install:
        description: "Install command; default installs the package editable if installable."
        type: string
        default: ""
      concurrency-suffix:
        description: "Disambiguator when one workflow calls this reusable workflow more than once."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: floor-ci-${{ github.workflow }}-${{ inputs.concurrency-suffix }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working-directory }}/requirements*.txt
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/setup.cfg
            ${{ inputs.working-directory }}/setup.py
            .github/workflows/*.yml

      - name: Install package
        env:
          INSTALL_CMD: ${{ inputs.install }}
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$INSTALL_CMD" ]; then
            echo "custom install: $INSTALL_CMD"
            eval "$INSTALL_CMD"
          elif [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e . || pip install . || echo "::warning::package not pip-installable; continuing for import/tests"
            # A package can still declare its TEST deps only in a requirements file (not in
            # the package metadata) — install the root requirements.txt too if present.
            if [ -f requirements.txt ]; then
              echo "also installing requirements.txt (test deps)"
              pip install -r requirements.txt || echo "::warning::requirements.txt install had problems; continuing"
            fi
          elif [ -f requirements.txt ]; then
            # No package metadata but a requirements.txt — the common "script repo + tests" shape.
            # Without this the suite imports its deps (fastapi/hassil/etc.) and CI goes red for the
            # wrong reason. (Fleet-floor v2 fix, 2026-06-30.)
            echo "no package metadata; installing requirements.txt"
            pip install -r requirements.txt || echo "::warning::requirements.txt install had problems; continuing"
          else
            echo "no python package metadata; nothing to install"
          fi
          pip install pytest
          if [ -n "${PYTEST_WORKERS:-}" ]; then
            pip install pytest-xdist
          fi

      - name: Run tests (pytest) or import-smoke
        env:
          TESTS: ${{ inputs.tests-path }}
          IMPORT: ${{ inputs.import-name }}
          PYTEST_WORKERS: ${{ inputs.pytest-workers }}
        run: |
          set -euo pipefail
          # Opt-in parallelism for suites that outgrow the job timeout when run serially (t_90c7065d).
          xdist=()
          case "${PYTEST_WORKERS:-}" in
            "") ;;
            auto) xdist=(-n auto) ;;
            *[!0-9]*|0*) echo "::error::pytest-workers must be 'auto' or a positive integer, got '${PYTEST_WORKERS}'"; exit 1 ;;
            *) xdist=(-n "$PYTEST_WORKERS") ;;
          esac
          # Detection MUST be pipefail-safe: the old `find | grep -q .` raced (grep -q exits on the first
          # match, find takes SIGPIPE -> 141 -> pipefail flips the condition FALSE -> a repo WITH tests
          # took import-smoke and went vacuously green; t_7146a779). `-print -quit`: no pipe, find exits 0.
          found=""
          if [ -n "$TESTS" ] && [ -d "$TESTS" ]; then
            found="$(find "$TESTS" \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit)"
          fi
          if [ -n "$found" ]; then
            echo "tests present -> pytest ($TESTS) [strength=real]"
            python -m pytest "$TESTS" -q ${xdist[@]+"${xdist[@]}"}
          elif [ -n "$TESTS" ] && [ -d "$TESTS" ] && python3 -c 'import pathlib, sys; d = pathlib.Path(sys.argv[1]); sys.exit(0 if next(d.rglob("test_*.py"), None) or next(d.rglob("*_test.py"), None) else 1)' "$TESTS"; then
            # Independent re-check: a weak branch over a dir that holds test files is a hard failure.
            echo "::error::$TESTS contains test files but detection chose the weak branch; refusing a vacuous green"
            exit 1
          elif [ -z "$IMPORT" ]; then
            echo "::notice::no tests and no import-name given; ci is a green no-op [strength=weak]"
            exit 0
          else
            echo "no tests -> import-smoke: import $IMPORT [strength=weak]"
            python -c "import importlib; importlib.import_module('$IMPORT'); print('import OK:', '$IMPORT')"
          fi
