# Reusable floor component: `slop-detect` (ADVISORY — frontend design anti-patterns).
# Runs the impeccable detector (pbakaus/impeccable, Apache-2.0) — 61 deterministic rules, no LLM,
# no network at scan time — against HTML/JSX/CSS in the caller repo.
# ENGINE (2026-09-08, v4 cutover): upstream deleted the JS engine and rewrote it in Rust. We fetch the
# prebuilt `impeccable-linux-x64` from the GitHub release `engine-v<version>` and VERIFY its sha256
# against the pinned digest before running. Node is no longer needed. Findings are the same JSON
# array shape ({antipattern,name,description,severity,file,line,snippet}); rc 0/2/1 unchanged.
# Advisory-tier findings (severity=advisory, e.g. design-system-* drift) never affect the exit code. ADVISORY by default: findings are surfaced
# as warning annotations + a step-summary table, job still succeeds. Flip `blocking: true` to gate
# (per Ace's prod-safety doctrine the OFF path is the default input, not an env hack).
# Internal job name `slop_detect` is a frozen contract (compound check-run: `<caller-job> / slop_detect`).
# Detector exit codes: 0 clean · 2 findings · 1 crash (crash FAILS the job even in advisory mode —
# a broken detector must be loud, not silently green; the hermaguard silent-zero lesson).
name: floor-slop-detect

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label (self-hosted opt-in; default GitHub-hosted)."
        type: string
        default: "ubuntu-latest"
      paths:
        description: "Space-separated files/dirs to scan (relative to repo root)."
        type: string
        default: "."
      blocking:
        description: "If true, findings (exit 2) fail the job. Default advisory."
        type: boolean
        default: false
      engine-version:
        description: "Pinned impeccable engine release (GitHub release tag engine-v<version>)."
        type: string
        default: "0.1.3"
      engine-sha256:
        description: "sha256 of impeccable-linux-x64 for engine-version (verified before run)."
        type: string
        default: "afc7a424e0bd6c606b7be4c773c70e87284afbdb41d748eb9a34f8a4478e57da"
      concurrency-suffix:
        type: string
        default: ""

    outputs:
      findings:
        description: "Number of anti-pattern findings (0 when clean)."
        value: ${{ jobs.slop_detect.outputs.findings }}

permissions:
  contents: read

concurrency:
  group: floor-slop-${{ github.workflow }}-${{ inputs.concurrency-suffix }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slop_detect:
    name: slop_detect
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      findings: ${{ steps.detect.outputs.findings }}
    steps:
      - uses: actions/checkout@v5
      - name: Install impeccable engine (pinned release, sha256-verified)
        env:
          VER: ${{ inputs.engine-version }}
          SHA: ${{ inputs.engine-sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/impeccable \
            "https://github.com/pbakaus/impeccable/releases/download/engine-v${VER}/impeccable-linux-x64"
          echo "${SHA}  /tmp/impeccable" | sha256sum -c -
          chmod +x /tmp/impeccable
          /tmp/impeccable --version
      - name: Run detector
        id: detect
        env:
          SCAN_PATHS: ${{ inputs.paths }}
          BLOCKING: ${{ inputs.blocking }}
        run: |
          read -r -a PATHS_ARR <<< "$SCAN_PATHS"
          set +e
          IMPECCABLE_NO_TELEMETRY=1 IMPECCABLE_NO_UPDATE_CHECK=1 \
            /tmp/impeccable detect --json "${PATHS_ARR[@]}" > /tmp/findings.raw.json
          rc=$?
          set -e
          # engine emits absolute paths; annotations need repo-relative
          jq --arg ws "$GITHUB_WORKSPACE/" 'map(.file |= ltrimstr($ws))' /tmp/findings.raw.json > /tmp/findings.json 2>/dev/null || echo '[]' > /tmp/findings.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "findings=0" >> "$GITHUB_OUTPUT"
            echo "### 🧹 Slop detector: clean (0 findings)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$rc" -eq 2 ]; then
            count=$(jq 'map(select(.severity != "advisory")) | length' /tmp/findings.json)
            echo "findings=$count" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Slop detector: ${count} finding(s)"
              echo ""
              echo "| Rule | File | Line | Snippet |"
              echo "|---|---|---|---|"
              jq -r '.[:50][] | "| \(.antipattern) | \(.file) | \(.line) | \((.snippet // "") | gsub("\\|"; "\\\\|") | .[:80]) |"' /tmp/findings.json
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[:50][] | "::warning file=\(.file),line=\([1, (.line // 1)] | max)::[\(.antipattern)] \(.name // "")"' /tmp/findings.json
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::slop-detect is BLOCKING and found ${count} anti-pattern(s)"
              exit 1
            fi
            exit 0
          else
            echo "::error::detector crashed (exit $rc) — advisory mode does NOT cover a broken detector"
            exit 1
          fi
      - name: Upload findings artifact
        if: steps.detect.outputs.rc == '2'
        uses: actions/upload-artifact@v4
        with:
          name: slop-findings-${{ github.run_id }}
          path: /tmp/findings.json
          retention-days: 14
