# Reusable floor component: `sast` — semgrep at ERROR severity (proven 0-noise on clean Python).
# Language-agnostic (configs are semgrep registry packs). Internal job name `sast` = frozen contract.
name: floor-sast

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label (self-hosted opt-in; default GitHub-hosted)."
        type: string
        default: "ubuntu-latest"
      target:
        description: "Path semgrep scans."
        type: string
        default: "."
      configs:
        description: "Space-separated semgrep --config values."
        type: string
        default: "p/python p/secrets"
      concurrency-suffix:
        description: "Disambiguator when one workflow calls this reusable workflow more than once."
        type: string
        default: ""
      semgrep-version:
        type: string
        default: "1.46.0"
      workflow-path-filter-lint:
        description: >-
          Fleet R14: fail a pull_request that adds or modifies a push/pull_request(_target)
          workflow with no paths:/paths-ignore: filter (it would fire on every bot/docs commit).
          Opt a workflow out on purpose with a line `# path-filter-exempt: <why>`.
        type: boolean
        default: true
      artifact-retention-lint:
        description: >-
          Fail a pull_request whose added/modified workflow has an actions/upload-artifact step with no
          retention-days (the default is the repo's 90 days), 0, or more than 7 days. Opt one step out on
          purpose with `# artifact-retention-ok: <why>` inside that step.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A reusable workflow's `github.job` is its OWN job id (always `sast`), so two callers in one run
  # still collide. The CALLER passes a unique `concurrency-suffix` (e.g. the caller job name) to keep
  # the groups distinct; default empty preserves single-caller behavior.
  group: floor-sast-${{ github.workflow }}-${{ inputs.concurrency-suffix }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: sast
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # 2 = the PR merge commit + its first parent (the base tip), so the path-filter lint can
          # diff exactly this PR's workflow changes without history.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/*.yml

      - name: Changed workflow files (path-filter lint input)
        if: (inputs.workflow-path-filter-lint || inputs.artifact-retention-lint) && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # HEAD = refs/pull/N/merge; HEAD^1 = base tip. Only files this PR adds/modifies/renames.
          git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- .github/workflows \
            | grep -E '\.ya?ml$' > /tmp/wf-changed.txt || true
          echo "workflow files changed by this PR: $(wc -l < /tmp/wf-changed.txt)"
          cat /tmp/wf-changed.txt

      - name: Workflow path-filter lint (fleet R14)
        if: inputs.workflow-path-filter-lint && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install -q "PyYAML>=6"
          python - /tmp/wf-changed.txt <<'PY'
          # Same rule as fleet-ops-scripts ci-speed-lint R14 (port of hermes-home #833).
          import re, sys, yaml
          EXEMPT = re.compile(r"^[ \t]*#[ \t]*path-filter-exempt:[ \t]*\S", re.M)
          bad = 0
          for path in [l.strip() for l in open(sys.argv[1]) if l.strip()]:
              text = open(path).read()
              if EXEMPT.search(text):
                  print("exempt: %s" % path)
                  continue
              try:
                  wf = yaml.safe_load(text) or {}
              except yaml.YAMLError as e:
                  print("::error file=%s::unparsable workflow (%s)" % (path, type(e).__name__)); bad += 1; continue
              on = wf.get("on", wf.get(True)) if isinstance(wf, dict) else None
              if isinstance(on, str): on = {on: None}
              if isinstance(on, list): on = {str(k): None for k in on}
              if not isinstance(on, dict): continue
              for trig in ("push", "pull_request", "pull_request_target"):
                  if trig not in on: continue
                  cfg = on[trig] if isinstance(on[trig], dict) else {}
                  if "paths" in cfg or "paths-ignore" in cfg: continue
                  if trig == "push" and ({"tags", "tags-ignore"} & set(cfg)) and not ({"branches", "branches-ignore"} & set(cfg)):
                      continue  # tag-only push never fires on a commit
                  print("::error file=%s::`%s` trigger has no paths/paths-ignore filter: it fires on every "
                        "bot/docs commit. Add a filter, or a line `# path-filter-exempt: <why>` "
                        "(e.g. the pull_request run is a required check)." % (path, trig))
                  bad += 1
          print("workflow path-filter lint: %d finding(s)" % bad)
          sys.exit(1 if bad else 0)
          PY

      - name: Artifact retention lint
        if: inputs.artifact-retention-lint && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python - /tmp/wf-changed.txt <<'PY'
          # Card t_eade26e1: 2026-10-16 the org hit its Actions artifact-storage quota. 2,900 prism-router
          # junit/log artifacts sat on the 30-day default, and 7 approved PRs were blocked for 2.5 h.
          # Every upload-artifact step names its own retention-days, 1..7. A longer one carries
          # `# artifact-retention-ok: <why>` inside the step.
          import re, sys
          MAX_DAYS = 7
          USES = re.compile(r"^(\s*)(-\s+)?uses:\s*['\"]?actions/upload-artifact[@/]")
          DASH = re.compile(r"^(\s*)-\s")
          RET = re.compile(r"(?:^|[\s{,])retention-days\s*:\s*['\"]?([^'\",}\s#]+)")
          WAIVER = re.compile(r"#\s*artifact-retention-ok:(.*)$")

          def code(line):
              return re.split(r"(?:^|\s)#", line, maxsplit=1)[0]

          def indent(line):
              return len(line) - len(line.lstrip())

          bad = 0
          for path in [l.strip() for l in open(sys.argv[1]) if l.strip()]:
              lines = open(path).read().splitlines()
              for i, line in enumerate(lines):
                  m = USES.match(line)
                  if not m:
                      continue
                  if m.group(2):
                      start, dash = i, len(m.group(1))
                  else:
                      start = next((j for j in range(i - 1, -1, -1) if DASH.match(lines[j])
                                    and len(DASH.match(lines[j]).group(1)) < len(m.group(1))), i)
                      dash = indent(lines[start])
                  end = next((j for j in range(start + 1, len(lines)) if lines[j].strip()
                              and not lines[j].lstrip().startswith("#") and indent(lines[j]) <= dash), len(lines))
                  block = lines[start:end]
                  vals = [r.group(1) for l in block for r in [RET.search(code(l))] if r]
                  waivers = [w.group(1).strip() for l in block for w in [WAIVER.search(l)] if w]
                  why = None
                  if not vals:
                      why = "no retention-days (the default is the repo's 90 days)"
                  elif vals[0].startswith("$"):
                      why = None  # an expression: the caller decides, nothing to read here
                  elif not vals[0].isdigit() or int(vals[0]) == 0:
                      why = "retention-days %s is not 1..%d (0 means the repo default, 90 days)" % (vals[0], MAX_DAYS)
                  elif int(vals[0]) > MAX_DAYS:
                      why = "retention-days %s > %d" % (vals[0], MAX_DAYS)
                  if why and waivers and all(waivers):
                      print("waived: %s:%d (%s)" % (path, i + 1, waivers[0]))
                      continue
                  if why and waivers:
                      why += "; the `# artifact-retention-ok:` waiver needs a reason"
                  if why:
                      print("::error file=%s,line=%d::upload-artifact step: %s. Set retention-days: 2 for "
                            "junit/logs/coverage, <= 7 for a dist another store also holds, or add "
                            "`# artifact-retention-ok: <why>` in the step." % (path, i + 1, why))
                      bad += 1
          print("artifact retention lint: %d finding(s)" % bad)
          sys.exit(1 if bad else 0)
          PY

      - name: Install semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: pip install "semgrep==$SEMGREP_VERSION"

      - name: Run semgrep (ERROR severity gate)
        env:
          SEMGREP_CONFIGS: ${{ inputs.configs }}
          SEMGREP_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          read -r -a CONFIG_VALUES <<< "$SEMGREP_CONFIGS"
          for c in "${CONFIG_VALUES[@]}"; do CONFIG_ARGS+=("--config=$c"); done
          semgrep "${CONFIG_ARGS[@]}" --severity=ERROR --error --quiet "$SEMGREP_TARGET"
