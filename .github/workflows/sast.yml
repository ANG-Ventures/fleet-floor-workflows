# Reusable floor component: `sast` — semgrep at ERROR severity (proven 0-noise on clean Python).
# Language-agnostic (configs are semgrep registry packs). Internal job name `sast` = frozen contract.
name: floor-sast

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label (self-hosted opt-in; default GitHub-hosted)."
        type: string
        default: "ubuntu-latest"
      target:
        description: "Path semgrep scans."
        type: string
        default: "."
      configs:
        description: "Space-separated semgrep --config values."
        type: string
        default: "p/python p/secrets"
      concurrency-suffix:
        description: "Disambiguator when one workflow calls this reusable workflow more than once."
        type: string
        default: ""
      semgrep-version:
        type: string
        default: "1.46.0"
      workflow-path-filter-lint:
        description: >-
          Fleet R14: fail a pull_request that adds or modifies a push/pull_request(_target)
          workflow with no paths:/paths-ignore: filter (it would fire on every bot/docs commit).
          Opt a workflow out on purpose with a line `# path-filter-exempt: <why>`.
        type: boolean
        default: true
      private-venue-lint:
        description: >-
          Fleet R15: in a PRIVATE repo, every job in a workflow this PR adds/modifies must run on a
          Blacksmith x64 label, the local CI box label `ace-ci-box`, or macos-*/windows-*
          (`vars.X || 'blacksmith-...'` fallbacks pass). `warn` annotates only, `fail` fails the
          check, `off` skips. Exempt a job with `# venue-exempt: <why>` / `# github-hosted: <why>`.
        type: string
        default: "warn"

permissions:
  contents: read

concurrency:
  # A reusable workflow's `github.job` is its OWN job id (always `sast`), so two callers in one run
  # still collide. The CALLER passes a unique `concurrency-suffix` (e.g. the caller job name) to keep
  # the groups distinct; default empty preserves single-caller behavior.
  group: floor-sast-${{ github.workflow }}-${{ inputs.concurrency-suffix }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: sast
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # 2 = the PR merge commit + its first parent (the base tip), so the path-filter lint can
          # diff exactly this PR's workflow changes without history.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/*.yml

      - name: Changed workflow files (path-filter lint input)
        if: (inputs.workflow-path-filter-lint || inputs.private-venue-lint != 'off') && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # HEAD = refs/pull/N/merge; HEAD^1 = base tip. Only files this PR adds/modifies/renames.
          git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- .github/workflows \
            | grep -E '\.ya?ml$' > /tmp/wf-changed.txt || true
          echo "workflow files changed by this PR: $(wc -l < /tmp/wf-changed.txt)"
          cat /tmp/wf-changed.txt

      - name: Workflow path-filter lint (fleet R14)
        if: inputs.workflow-path-filter-lint && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          pip install -q "PyYAML>=6"
          python - /tmp/wf-changed.txt <<'PY'
          # Same rule as fleet-ops-scripts ci-speed-lint R14 (port of hermes-home #833).
          import re, sys, yaml
          EXEMPT = re.compile(r"^[ \t]*#[ \t]*path-filter-exempt:[ \t]*\S", re.M)
          bad = 0
          for path in [l.strip() for l in open(sys.argv[1]) if l.strip()]:
              text = open(path).read()
              if EXEMPT.search(text):
                  print("exempt: %s" % path)
                  continue
              try:
                  wf = yaml.safe_load(text) or {}
              except yaml.YAMLError as e:
                  print("::error file=%s::unparsable workflow (%s)" % (path, type(e).__name__)); bad += 1; continue
              on = wf.get("on", wf.get(True)) if isinstance(wf, dict) else None
              if isinstance(on, str): on = {on: None}
              if isinstance(on, list): on = {str(k): None for k in on}
              if not isinstance(on, dict): continue
              for trig in ("push", "pull_request", "pull_request_target"):
                  if trig not in on: continue
                  cfg = on[trig] if isinstance(on[trig], dict) else {}
                  if "paths" in cfg or "paths-ignore" in cfg: continue
                  if trig == "push" and ({"tags", "tags-ignore"} & set(cfg)) and not ({"branches", "branches-ignore"} & set(cfg)):
                      continue  # tag-only push never fires on a commit
                  print("::error file=%s::`%s` trigger has no paths/paths-ignore filter: it fires on every "
                        "bot/docs commit. Add a filter, or a line `# path-filter-exempt: <why>` "
                        "(e.g. the pull_request run is a required check)." % (path, trig))
                  bad += 1
          print("workflow path-filter lint: %d finding(s)" % bad)
          sys.exit(1 if bad else 0)
          PY

      - name: Private-repo runner venue lint (fleet R15)
        if: inputs.private-venue-lint != 'off' && github.event_name == 'pull_request' && github.event.repository.private
        env:
          R15_MODE: ${{ inputs.private-venue-lint }}
        run: |
          set -euo pipefail
          pip install -q "PyYAML>=6"
          python - /tmp/wf-changed.txt <<'PY'
          # Same rule as fleet-ops-scripts ci-speed-lint R15 (t_b38fe79c). Private repos only.
          import json, os, re, sys, yaml
          MODE = os.environ.get("R15_MODE", "warn")
          EXEMPT = re.compile(r"#[ \t]*(venue-exempt|github-hosted):[ \t]*\S")
          ARM = re.compile(r"blacksmith-[a-z0-9._-]*?-arm(?![a-z])")
          def ok(l):
              l = str(l).strip().lower()
              return (l == "ace-ci-box" or l.startswith(("macos-", "windows-"))
                      or (l.startswith("blacksmith-") and not ARM.search(l)))
          def cands(ro, job, wf, d=0):
              """(label sets ro can evaluate to, unresolvable refs). vars.* is runtime-only."""
              if d > 4: return [], ["<nested>"]
              if isinstance(ro, dict):
                  return cands(ro["labels"], job, wf, d + 1) if "labels" in ro else ([], ["runs-on group"])
              if isinstance(ro, list):
                  if not any(("$" + "{{") in str(x) for x in ro): return [[str(x) for x in ro]], []
                  c, u = [], []
                  for x in ro:
                      a, b = cands(x, job, wf, d + 1); c += a; u += b
                  return c, u
              s = str(ro or "").strip()
              exprs = re.findall(r"\$\{\{(.*?)\}\}", s, re.S)
              if not exprs: return ([[s]] if s else []), []
              c, u = [], []
              for e in exprs:
                  for m in re.finditer(r"'((?:[^']|'')*)'", e):
                      if re.search(r"(==|!=)\s*$", e[:m.start()]) or re.match(r"\s*(==|!=)", e[m.end():]): continue
                      lit = m.group(1).replace("''", "'")
                      try: v = json.loads(lit)
                      except ValueError: v = lit
                      c.append([str(x) for x in v] if isinstance(v, list) else [str(v)])
                  bare = re.sub(r"'((?:[^']|'')*)'", "''", e)
                  for m in re.finditer(r"\b([A-Za-z_]+)\.([A-Za-z0-9_-]+)", bare):
                      ctx, key = m.groups()
                      if ctx == "vars": continue
                      if ctx == "github" and re.search(r"github\.[\w.]+\s*(==|!=)", bare[m.start():]): continue
                      vals = None
                      if ctx == "matrix":
                          mx = (job.get("strategy") or {}).get("matrix") if isinstance(job.get("strategy"), dict) else None
                          if isinstance(mx, dict):
                              vals = list(mx.get(key)) if isinstance(mx.get(key), list) else []
                              vals += [i[key] for i in (mx.get("include") or []) if isinstance(i, dict) and key in i]
                              vals = vals or None
                      elif ctx == "inputs":
                          on = wf.get("on", wf.get(True)) or {}
                          found = False
                          for ev in ("workflow_call", "workflow_dispatch"):
                              ins = (on.get(ev) or {}).get("inputs") if isinstance(on, dict) and isinstance(on.get(ev), dict) else None
                              if isinstance(ins, dict) and isinstance(ins.get(key), dict):
                                  found = True
                                  if "default" in ins[key]: vals = [ins[key]["default"]]
                          if found and vals is None: continue
                      if vals is None: u.append("%s.%s" % (ctx, key)); continue
                      for v in vals:
                          a, b = cands(v, job, wf, d + 1); c += a; u += b
              return c, u
          bad = 0
          for path in [l.strip() for l in open(sys.argv[1]) if l.strip()]:
              text = open(path).read(); lines = text.splitlines()
              try:
                  root = yaml.compose(text); wf = yaml.safe_load(text) or {}
              except yaml.YAMLError:
                  continue  # the R14 step already reports unparsable workflows
              spans, jobs_line = {}, -1
              if isinstance(root, yaml.MappingNode):
                  for k, v in root.value:
                      if k.value == "jobs" and isinstance(v, yaml.MappingNode):
                          jobs_line = k.start_mark.line
                          spans = {str(jk.value): (jk.start_mark.line, jv.end_mark.line) for jk, jv in v.value}
              if any(EXEMPT.search(l) for l in lines[:max(jobs_line, 0)]):
                  print("exempt: %s" % path); continue
              for jid, job in ((wf.get("jobs") or {}) if isinstance(wf, dict) else {}).items():
                  job = job if isinstance(job, dict) else {}
                  a, b = spans.get(str(jid), (0, -1))
                  if any(EXEMPT.search(l) for l in lines[a:b + 1]): continue
                  uses = str(job.get("uses") or ""); w = job.get("with") if isinstance(job.get("with"), dict) else {}
                  msgs = []
                  if uses:
                      if "runner" not in w:
                          if not uses.startswith("./"):
                              msgs.append("reusable workflow %s runs on its default runner (ubuntu-latest); pass `runner:`" % uses.split("@")[0])
                          ro = None
                      else:
                          ro = w["runner"]
                          if isinstance(ro, str) and ro.strip().startswith(("[", '"')):
                              try: ro = json.loads(ro)
                              except ValueError: pass
                  else:
                      ro = job.get("runs-on")
                      if ro is None: msgs.append("no runs-on")
                  if ro is not None:
                      c, u = cands(ro, job, wf)
                      msgs += ["runs-on %s" % ",".join(x) for x in c if not any(ok(l) for l in x)]
                      msgs += ["runs-on depends on %s (venue not provable)" % x for x in u]
                  for m in dict.fromkeys(msgs):
                      print("::%s file=%s::job `%s` %s: private repo on GitHub-hosted Linux (metered minutes). Use a "
                            "Blacksmith x64 label, `vars.CI_RUNNER || 'blacksmith-...'`, or ace-ci-box; else a line "
                            "`# venue-exempt: <why>` in the job." % ("error" if MODE == "fail" else "warning", path, jid, m))
                      bad += 1
          print("private-repo venue lint (%s): %d finding(s)" % (MODE, bad))
          sys.exit(1 if bad and MODE == "fail" else 0)
          PY

      - name: Install semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: pip install "semgrep==$SEMGREP_VERSION"

      - name: Run semgrep (ERROR severity gate)
        env:
          SEMGREP_CONFIGS: ${{ inputs.configs }}
          SEMGREP_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          read -r -a CONFIG_VALUES <<< "$SEMGREP_CONFIGS"
          for c in "${CONFIG_VALUES[@]}"; do CONFIG_ARGS+=("--config=$c"); done
          semgrep "${CONFIG_ARGS[@]}" --severity=ERROR --error --quiet "$SEMGREP_TARGET"
