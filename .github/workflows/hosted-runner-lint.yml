# Reusable floor component: `hosted_runner_lint` -- a PRIVATE repo's workflows never resolve to a metered
# GitHub-hosted runner (card t_a8dc95de). 2026-10-16: ANG-Ventures Actions Oct 1-16 GROSS $2,730.90 hid behind
# NET $296.36; private hermes-home light lints fell back to `vars.X || 'ubuntu-latest'` with the var unset.
# Ace 2026-10-16: free GitHub-hosted minutes (PUBLIC repos, net $0) are fine, billed ones are not.
#
# Rule: a workflow code line naming `ubuntu-*` / `windows-*` / `macos-*` (literal runs-on, matrix value,
# `with: runner:`, an input default, the fallback of `vars.X || '...'`) is a FINDING with path:line, unless the
# line or its job carries `# hosted-ok: <why>`. A PUBLIC caller (`github.event.repository.private == false`)
# is skipped. The scanner is scripts/hosted_runner_lint.py, embedded below BASE64 (its fixtures carry literal
# GitHub expression text, which GitHub would parse inside run:); tests/test_hosted_runner_lint.py pins decode == source, so the
# caller's SHA pin pins the scanner too. Regenerate: base64 -w100 scripts/hosted_runner_lint.py.
# Internal job name `hosted_runner_lint` is a frozen contract.
# CALLER `paths:`: none (README "Caller path filters"); the lint reads only .github/workflows and takes ~1 s.
name: floor-hosted-runner-lint

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Private ANG-Ventures repos pass hermes-ci (the lint fails a hosted default)."
        type: string
        # hosted-ok: a PUBLIC caller may run this floor on free hosted minutes; private callers pass hermes-ci
        default: "ubuntu-latest"
      concurrency-suffix:
        description: "Disambiguator when one workflow calls this reusable workflow more than once."
        type: string
        default: ""

concurrency:
  group: floor-hosted-runner-${{ github.workflow }}-${{ inputs.concurrency-suffix }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hosted_runner_lint:
    name: hosted_runner_lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Hosted runner lint
        env:
          HOSTED_RUNNER_LINT_REPO_PRIVATE: ${{ github.event.repository.private }}
