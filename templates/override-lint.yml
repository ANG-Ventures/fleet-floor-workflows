# Override lint — thin caller (t_8f526b34). A PR that ADDS a refusal string (scoped paths, or a new
# raise/emit_block/sys.exit/HTTPException(409) with refusal wording) must carry an `Override:` line in
# its body naming the flag/env/reason field, or `Override: none by design — <why>`.
# Copy to .github/workflows/override-lint.yml. Pin `uses:` to an IMMUTABLE 40-hex commit SHA of
# ANG-Ventures/fleet-floor-workflows (never a moving tag).
#
# Placeholders:
#   __FLOOR_SHA__   40-char commit SHA of the central repo
#   __RUNNER__      private ANG-Ventures repo: blacksmith-2vcpu-ubuntu-2404 (x64 only).
#                   Public or Kyzcreig repo: ubuntu-latest.
name: override-lint

# path-filter-exempt: no `paths:` on purpose (Prism 7782a5f9dbf6, t_0e51de69). GitHub drops a filtered
# workflow when the PR diff has more than 3,000 files and none of the first 3,000 match, so a big PR whose
# code files sort late would skip the lint silently. The lint already ignores non-code and test files
# itself (README "Caller path filters"), so an unfiltered run on a docs-only PR finds no hits and passes.
# Not a required check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  override_lint:
    uses: ANG-Ventures/fleet-floor-workflows/.github/workflows/override-lint.yml@__FLOOR_SHA__
    with:
      runner: __RUNNER__
      # Repos whose skills live elsewhere: pass the dirs grepped for the named override (warning only).
      # docs-paths: "skills-shared skills"
      # Reviewed no-override-by-design additions, one per line (`path:<regex> <why>` / `line:<regex> <why>`):
      # allowlist: |
      #   line:my refusal text reviewed in PR #N
